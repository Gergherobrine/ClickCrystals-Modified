name: Sync dev3 verified runtime notes
on:
  push:
    branches: [main]
    paths: [".github/workflows/sync-dev3-notes.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update GitHub pre-release description and attached Markdown
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v1.4.5-dev.3 \
            --repo "${GITHUB_REPOSITORY}" \
            --notes-file DEV_1.4.5-dev.3.md
          gh release upload v1.4.5-dev.3 \
            --repo "${GITHUB_REPOSITORY}" --clobber DEV_1.4.5-dev.3.md
