name: Publish ClickCrystals Modified 1.4.5-dev.4 Threading Hotfix
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-dev4-thread-fix.yml"]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download all three verified dev4 artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: 42470795585
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          pattern: clickcrystals-dev4-*
          merge-multiple: true
          path: release-assets
      - name: Validate artifact filenames, metadata, and patch classes
        shell: bash
        run: |
          set -euo pipefail
          for game in 1.21.11 26.1.2 26.2; do
            jar="release-assets/ClickCrystals-Modified-${game}-1.4.5-dev.4.jar"
            test -f "$jar"
            test "$(stat -c%s "$jar")" -gt 100000
            unzip -t "$jar" >/dev/null
            python3 - "$jar" "$game" <<'PY'
          import json,sys,zipfile
          path,game=sys.argv[1:]
          with zipfile.ZipFile(path) as f:
              meta=json.loads(f.read("fabric.mod.json"))
              contents=f.namelist()
          assert meta["version"] == game + "-1.4.5-dev.4", meta
          assert meta["name"] == "ClickCrystals Modified", meta
          for cls in ("WaitCmd", "ClickScript"):
              assert any(x.endswith("/"+cls+".class") for x in contents),cls
          print("Verified dev4",game)
          PY
          done
          test "$(find release-assets -maxdepth 1 -name '*.jar' | wc -l)" -eq 3
          cp DEV_1.4.5-dev.4.md release-assets/DEV_1.4.5-dev.4.md
          (cd release-assets && sha256sum *.jar > SHA256SUMS.txt)
      - name: Publish hotfix pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.4.5-dev.4 \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "ClickCrystals Modified 1.4.5-dev.4 — Thread Safety Hotfix" \
            --prerelease \
            --notes-file DEV_1.4.5-dev.4.md \
            release-assets/ClickCrystals-Modified-1.21.11-1.4.5-dev.4.jar \
            release-assets/ClickCrystals-Modified-26.1.2-1.4.5-dev.4.jar \
            release-assets/ClickCrystals-Modified-26.2-1.4.5-dev.4.jar \
            release-assets/DEV_1.4.5-dev.4.md \
            release-assets/SHA256SUMS.txt
