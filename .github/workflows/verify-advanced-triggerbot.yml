name: Verify Advanced TriggerBot (1.21.11)
on:
  push:
    branches:
      - feat/advanced-triggerbot-12111-dev7
  pull_request:
    paths:
      - 'src/main/java/io/github/itzispyder/clickcrystals/combat/**'
      - 'src/main/java/io/github/itzispyder/clickcrystals/modules/modules/anchoring/AdvancedTriggerBot.java'
      - 'src/test/java/io/github/itzispyder/clickcrystals/combat/**'
      - 'build.gradle'
      - '.github/workflows/verify-advanced-triggerbot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Fabric 1.21.11 / Java 21 / Decision Regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run decision regressions
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace clean check build
      - name: Upload development JAR (not gameplay-verified)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ClickCrystals-Modified-AdvancedTriggerBot-1.21.11-unverified
          path: build/libs/*.jar
          if-no-files-found: error
